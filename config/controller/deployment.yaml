apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisix-controller
  labels:
    app.kubernetes.io/name: aisix-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aisix-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aisix-controller
    spec:
      serviceAccountName: aisix-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: aisix-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --secret=aisix-resources
            - --deployment=aisix
            - --gateway-status-port=9090
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Resources files being validated.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
